<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="artTitle artDesc">
<title id="artTitle">Sessile Oak versus European Beech: two genuine 0.60 metre nursery-transplant concepts</title>
<desc id="artDesc">Two same-height narrow juvenile tree silhouettes with accurate outline cues, twig and bud callouts, separate monochrome miniatures, and a schematic walking-distance comparison. Artwork is original, illustrative rather than botanically scaled photography.</desc>
<defs>
  <path id="oakLeaf" d="M0,-28 C-9,-28 -8,-20 -13,-18 C-24,-18 -27,-9 -18,-5 C-27,3 -24,12 -15,13 C-18,23 -9,25 -3,21 L0,29 L3,21 C12,25 18,23 15,13 C24,12 27,3 18,-5 C27,-9 24,-18 13,-18 C8,-20 9,-28 0,-28 Z" fill="#668c50" stroke="#31553c" stroke-width="1.6"/>
  <path id="beechLeaf" d="M0,-33 C-11,-27 -18,-18 -19,-8 Q-21,0 -18,9 Q-14,21 0,31 Q14,21 18,9 Q21,0 19,-8 Q18,-18 11,-27 Z" fill="#80a46a" stroke="#345c46" stroke-width="1.6"/>
  <path id="monoOakLeaf" d="M0,-28 C-9,-28 -8,-20 -13,-18 C-24,-18 -27,-9 -18,-5 C-27,3 -24,12 -15,13 C-18,23 -9,25 -3,21 L0,29 L3,21 C12,25 18,23 15,13 C24,12 27,3 18,-5 C27,-9 24,-18 13,-18 C8,-20 9,-28 0,-28 Z" fill="#38443e"/>
  <path id="monoBeechLeaf" d="M0,-33 C-11,-27 -18,-18 -19,-8 Q-21,0 -18,9 Q-14,21 0,31 Q14,21 18,9 Q21,0 19,-8 Q18,-18 11,-27 Z" fill="#38443e"/>
</defs>
