<text x="54" y="88" font-family="Arial,sans-serif" font-size="18" fill="#4b615b">Source-informed shape study • not a 3D production asset • 60 cm is game stock height, not nursery age</text>
<rect x="46" y="112" width="652" height="600" rx="20" fill="#ffffff" stroke="#cbd6ce" stroke-width="2"/>
