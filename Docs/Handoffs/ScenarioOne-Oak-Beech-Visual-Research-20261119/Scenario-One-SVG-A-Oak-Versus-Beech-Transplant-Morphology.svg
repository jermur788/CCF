<text x="907" y="815" font-family="Arial,sans-serif" font-size="18" fill="#34483f">Ellipses + thin pointed bud tips</text>
<text x="907" y="841" font-family="Arial,sans-serif" font-size="17" fill="#51665b">Avoid a generic round leaf canopy</text>
