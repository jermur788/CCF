<text x="780" y="159" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#243e35">EUROPEAN BEECH</text>
<text x="780" y="188" font-family="Arial,sans-serif" font-size="19" font-style="italic" fill="#52665a">Fagus sylvatica • fine sprays, pointed buds</text>
