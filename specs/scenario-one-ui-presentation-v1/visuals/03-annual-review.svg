<text x="52" y="831" fill="#cad4cd" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500">For earlier years: read-only, no acknowledgement; choose latest year to acknowledge.</text>
<text x="30" y="887" fill="#d6ccb5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500">SCHEMATIC ONLY · example values/labels · bind every value/action to the current game · not a Unity screenshot</text>
