<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="CCF UI implementation reference diagram">
<defs><linearGradient id="forest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#244637"/><stop offset="1" stop-color="#071e19"/></linearGradient><linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#163b30"/><stop offset="1" stop-color="#081e18"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#canvas)"/>
<rect x="0" y="0" width="1600" height="105" rx="0" fill="#0a201b" stroke="none" stroke-width="1"/>
<text x="30" y="43" fill="#f7f5ed" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="800">D · Consistent navigation and action hierarchy</text>
<text x="30" y="75" fill="#cad4cd" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="450">These are UI presentation rules; never bypass the existing gameplay, approval or review gates</text>
<line x1="30" y1="90" x2="1570" y2="90" stroke="#47705f" stroke-width="2"/>
<rect x="54" y="130" width="1490" height="122" rx="15" fill="#14382f" stroke="#47705f" stroke-width="2"/>
<rect x="67" y="149" width="48" height="48" rx="10" fill="#f5f0e0" stroke="none" stroke-width="1"/>
<text x="81" y="182" fill="#0a201b" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="800">1</text>
<text x="135" y="166" fill="#f7f5ed" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="770">1. Forest and inspection</text>
<text x="135" y="202" fill="#cad4cd" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="500">One objective cue   |   Year + Cash top-right   |   context keycaps along bottom</text>
<text x="135" y="230" fill="#afdec3" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500">[O] Objectives   [M] Stand Map   [Tab] Work Plan   [V] Detail if inspecting</text>
<rect x="54" y="290" width="1490" height="122" rx="15" fill="#194b3e" stroke="#47705f" stroke-width="2"/>
<rect x="67" y="309" width="48" height="48" rx="10" fill="#f5f0e0" stroke="none" stroke-width="1"/>
<text x="81" y="342" fill="#0a201b" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="800">2</text>
<text x="135" y="326" fill="#f7f5ed" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="770">2. Work Plan</text>
<text x="135" y="362" fill="#cad4cd" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="500">Pending marks / proposals are not completed work; preserve real approval and warning guards</text>
<text x="135" y="390" fill="#afdec3" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500">Review entries and quote   →   Approve Work Plan   →   Advance one year</text>
<rect x="54" y="450" width="1490" height="122" rx="15" fill="#14382f" stroke="#47705f" stroke-width="2"/>
<rect x="67" y="469" width="48" height="48" rx="10" fill="#f5f0e0" stroke="none" stroke-width="1"/>
<text x="81" y="502" fill="#0a201b" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="800">3</text>
<text x="135" y="486" fill="#f7f5ed" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="770">3. Annual Review</text>
<text x="135" y="522" fill="#cad4cd" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="500">Work done   |   Money   |   Forest changes   |   source provenance toggle OFF by default</text>
<text x="135" y="550" fill="#afdec3" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500">Historical years read-only; latest review acknowledgement remains distinct from Back</text>
<rect x="54" y="610" width="1490" height="122" rx="15" fill="#194b3e" stroke="#47705f" stroke-width="2"/>
<rect x="67" y="629" width="48" height="48" rx="10" fill="#f5f0e0" stroke="none" stroke-width="1"/>
<text x="81" y="662" fill="#0a201b" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="800">4</text>
<text x="135" y="646" fill="#f7f5ed" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="770">4. Return to forest</text>
<text x="135" y="682" fill="#cad4cd" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="500">Clear safe next action, unchanged teaching stages, no repeated global panels</text>
<text x="135" y="710" fill="#afdec3" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500">Resume decisions only after the governing review gate is satisfied</text>
<rect x="54" y="758" width="1490" height="92" rx="13" fill="#0a201b" stroke="#dfac4b" stroke-width="2"/>
<text x="76" y="794" fill="#dfac4b" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="800">EXCLUSIONS</text>
<text x="249" y="794" fill="#f7f5ed" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700">No background browsing-pressure strip   •   No biodiversity score</text>
<text x="249" y="824" fill="#cad4cd" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="500">No pulsing Approve control   •   No disabled Back gate   •   No mark/proposal confusion</text>
<text x="30" y="887" fill="#d6ccb5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500">SCHEMATIC ONLY · example values/labels · bind every value/action to the current game · not a Unity screenshot</text>
</svg>